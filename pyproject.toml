[project]
name = "app"
version = "0.1.0"
description = "Backend API + worker built on FastAPI, svcs DI, SQLAlchemy/Alembic, and an SQS worker."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "svcs>=25.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "boto3>=1.35",
]

[project.scripts]
worker = "app.worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
# Alembic writes these; don't lint generated migration bodies.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "lib is independent of api and worker"
type = "forbidden"
source_modules = ["app.lib"]
forbidden_modules = ["app.api", "app.worker"]

[[tool.importlinter.contracts]]
name = "api does not import worker"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.worker"]

[[tool.importlinter.contracts]]
name = "worker does not import api"
type = "forbidden"
source_modules = ["app.worker"]
forbidden_modules = ["app.api"]
